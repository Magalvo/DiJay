services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}"
      SPOTIFY_COUNTRY_CODE: "${SPOTIFY_COUNTRY_CODE:-PT}"
      # Required for YouTube playback (plugins.youtube.oauth in application.yml). Leave unset
      # for the first boot: Lavalink then prints a device-login code to link a burner account.
      # See docs/canonical/operations.md.
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${YOUTUBE_OAUTH_REFRESH_TOKEN:-}"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2333"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - dijay-private

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DIJAY_ENV_FILE:-.env}
    environment:
      DATA_DIR: /app/data
      HEALTH_PORT: 3000
      LAVALINK_HOST: lavalink
      NODE_ENV: production
    depends_on:
      lavalink:
        condition: service_healthy
    volumes:
      - ./audio-actions:/app/audio-actions:ro
      - dijay-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - dijay-private

networks:
  dijay-private:
    driver: bridge

volumes:
  dijay-data:
