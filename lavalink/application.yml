server:
  address: 0.0.0.0
  port: 2333

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    playerUpdateInterval: 5
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # If tracks resolve (a title shows and the bot joins) but playback then fails with
    # "TrackExceptionEvent" / "This video requires login" in the Lavalink logs, a plugin
    # version bump alone will not fix it - YouTube is treating the request as needing a real
    # account. Enable OAuth instead: set oauth.enabled: true, `docker compose up -d --force-recreate
    # lavalink`, then watch `docker compose logs -f lavalink` for a device-login URL/code, sign
    # in with a real Google/YouTube account in a browser, and the plugin prints a refresh token
    # to the logs. Paste that into refreshToken below so it survives restarts (otherwise the
    # device-login flow has to be redone every time). See
    # https://github.com/lavalink-devs/youtube-source for details, including the alternative
    # (narrower, WEB/WEBEMBEDDED-only) poToken option.
    # oauth:
    #   enabled: true
    #   refreshToken: ""
  lavasrc:
    # Spotify is a "mirror" source: LavaSrc reads Spotify metadata and streams the
    # audio through these providers. ISRC matching is the most accurate mirror.
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      # Anonymous token from the spotify-tokener sidecar (WI-017), used for every metadata call.
      # This replaces the Client Credentials flow, which now requires the credentials-owning
      # account to hold an active Premium subscription (see WI-017 for how this was confirmed).
      # Unofficial / outside Spotify's Terms of Service - see docs/canonical/operations.md.
      customTokenEndpoint: "http://spotify-tokener:8080/api/token"
      countryCode: "${SPOTIFY_COUNTRY_CODE:PT}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true

logging:
  level:
    root: INFO
    lavalink: INFO
