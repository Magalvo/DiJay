server:
  address: 0.0.0.0
  port: 2333

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    playerUpdateInterval: 5
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      # TVHTML5 is the only client that ever gets OAuth applied to its requests (confirmed in
      # youtube-plugin's own source: Client.supportsOAuth() defaults to false and only the "Tv"
      # class overrides it to true; YoutubeAudioTrack.process() sets the oauth-enabled flag per
      # client from that value on every attempt). It cannot resolve/search on its own
      # (canHandleRequest always returns false there), so it only ever participates as the last
      # fallback for loading the actual stream format - safe to always include. Without it in
      # this list, an authenticated oauth block below has literally no effect: none of the
      # other clients ever apply the token, so "This video requires login" persists identically
      # even after a successful device login (this bit us once - do not remove this line).
      - TVHTML5
    # If tracks resolve (a title shows and the bot joins) but playback then fails with
    # "TrackExceptionEvent" / "This video requires login" in the Lavalink logs, a plugin
    # version bump alone will not fix it - YouTube is treating the request as needing a real
    # account. Enable OAuth instead:
    #   1. Uncomment the oauth block below. TVHTML5 must stay in the clients list above, or
    #      this has no effect (see the comment there).
    #   2. `docker compose up -d --force-recreate lavalink`, then watch
    #      `docker compose logs -f lavalink` for a device-login URL/code.
    #   3. Sign in with a real Google/YouTube account in a browser using that code.
    #   4. The plugin prints a refresh token to the logs. Put it in YOUTUBE_OAUTH_REFRESH_TOKEN
    #      in .env (never in this committed file - it grants ongoing account access) and
    #      recreate lavalink again so it survives restarts without redoing the device login.
    # See https://github.com/lavalink-devs/youtube-source for details, including the
    # alternative (narrower, WEB/WEBEMBEDDED-only) poToken option.
    # oauth:
    #   enabled: true
    #   refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
  lavasrc:
    # Spotify is a "mirror" source: LavaSrc reads Spotify metadata and streams the
    # audio through these providers. ISRC matching is the most accurate mirror.
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      # Anonymous token from the spotify-tokener sidecar (WI-017), used for every metadata call.
      # This replaces the Client Credentials flow, which now requires the credentials-owning
      # account to hold an active Premium subscription (see WI-017 for how this was confirmed).
      # Unofficial / outside Spotify's Terms of Service - see docs/canonical/operations.md.
      customTokenEndpoint: "http://spotify-tokener:8080/api/token"
      countryCode: "${SPOTIFY_COUNTRY_CODE:PT}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true

logging:
  level:
    root: INFO
    lavalink: INFO
